<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181F" />
      <stop offset="50%" stop-color="#0B0D12" />
      <stop offset="100%" stop-color="#0E1219" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#commGrad)" />
  <rect width="800" height="480" fill="url(#dotGrid)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="240" r="220" fill="url(#blueGlow)" filter="blur(30px)" />

  <!-- Network Nodes -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3">
    <line x1="180" y1="140" x2="320" y2="200" />
    <line x1="320" y1="200" x2="480" y2="170" />
    <line x1="480" y1="170" x2="620" y2="250" />
    <line x1="320" y1="200" x2="400" y2="340" />
    <line x1="400" y1="340" x2="580" y2="330" />
  </g>
  <circle cx="180" cy="140" r="5" fill="#38BDF8" />
  <circle cx="320" cy="200" r="6" fill="#D4AF37" />
  <circle cx="480" cy="170" r="5" fill="#38BDF8" />
  <circle cx="620" cy="250" r="7" fill="#818CF8" />
  <circle cx="400" cy="340" r="6" fill="#38BDF8" />
  <circle cx="580" cy="330" r="5" fill="#D4AF37" />

  <!-- Center Card Placeholder Badge -->
  <rect x="240" y="190" width="320" height="100" rx="14" fill="#07090E" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Community User Icon -->
  <g transform="translate(265, 222)" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 17 21 v-2 a 4 4 0 0 0 -4 -4 H 5 a 4 4 0 0 0 -4 4 v 2" />
    <circle cx="9" cy="7" r="4" />
    <path d="M 23 21 v-2 a 4 4 0 0 0 -3 -3.87" />
    <path d="M 16 3.13 a 4 4 0 0 1 0 7.75" />
  </g>

  <text x="325" y="240" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" letter-spacing="1">COMMUNITY PROMO</text>
  <text x="325" y="262" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">IMAGE PLACEHOLDER</text>
</svg>
