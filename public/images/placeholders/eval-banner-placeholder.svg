<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1811" />
      <stop offset="50%" stop-color="#0E0D09" />
      <stop offset="100%" stop-color="#14120B" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F3E5AB" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#evalGrad)" />
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- Abstract Chart Curve -->
  <path d="M 50 380 Q 200 320, 320 260 T 550 180 T 750 90" fill="none" stroke="url(#goldGlow)" stroke-width="32" stroke-linecap="round" filter="blur(8px)" />
  <path d="M 50 380 Q 200 320, 320 260 T 550 180 T 750 90" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
  
  <!-- Glowing Dots -->
  <circle cx="320" cy="260" r="5" fill="#D4AF37" />
  <circle cx="550" cy="180" r="5" fill="#D4AF37" />
  <circle cx="750" cy="90" r="7" fill="#F59E0B" />
  <circle cx="750" cy="90" r="14" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.5" />

  <!-- Center Card Placeholder Badge -->
  <rect x="250" y="190" width="300" height="100" rx="14" fill="#0B0A07" fill-opacity="0.85" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Placeholder Image Icon -->
  <g transform="translate(275, 222)" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="36" height="36" rx="6" />
    <circle cx="12" cy="12" r="3" fill="#D4AF37" />
    <path d="M 36 26 L 24 14 L 6 32" />
  </g>

  <text x="330" y="240" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" letter-spacing="1">CHALLENGE PROMO</text>
  <text x="330" y="262" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">IMAGE PLACEHOLDER</text>

  <!-- Accent Divider -->
  <line x1="100" y1="440" x2="700" y2="440" stroke="url(#accentLine)" stroke-width="2" />
</svg>
